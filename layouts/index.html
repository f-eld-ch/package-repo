<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }}</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1a1a1a;
      --muted: #6b7280;
      --code-bg: #f3f4f6;
      --code-border: #e5e7eb;
      --link: #2563eb;
      --hr: #e5e7eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0f0f;
        --fg: #e5e5e5;
        --muted: #9ca3af;
        --code-bg: #1e1e1e;
        --code-border: #374151;
        --link: #60a5fa;
        --hr: #374151;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.6;
      padding: 2rem 1rem;
    }
    main {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 { font-size: 1.75rem; margin-bottom: 0.25rem; }
    h2 { font-size: 1.2rem; margin: 2rem 0 0.75rem; }
    p, li { margin-bottom: 0.5rem; }
    ul { padding-left: 1.5rem; }
    a { color: var(--link); }
    hr { border: none; border-top: 1px solid var(--hr); margin: 2rem 0; }
    pre {
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: 6px;
      padding: 1rem;
      overflow-x: auto;
      margin: 0.75rem 0;
    }
    code {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 0.875rem;
    }
    p code, li code {
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: 3px;
      padding: 0.1em 0.3em;
    }
    blockquote {
      border-left: 3px solid var(--code-border);
      padding-left: 1rem;
      color: var(--muted);
      margin: 0.75rem 0;
    }
    footer {
      margin-top: 3rem;
      color: var(--muted);
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <main>
    {{ .Content }}
    <footer>
      <hr>
      <p><a href="https://f-eld.ch">f-eld.ch</a> &mdash; <a href="https://github.com/f-eld-ch/sitrep/blob/main/LICENSE">AGPL-3.0</a></p>
    </footer>
  </main>
</body>
</html>
