name: Update Package Repository

# The whole site is rebuilt from the sitrep GitHub releases on every run and
# deployed with GitHub Pages (Settings → Pages → Source: "GitHub Actions").
# Nothing is committed to a gh-pages branch, so binaries never enter git history.

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [new-release]
  workflow_dispatch:
    inputs:
      keep_versions:
        description: 'Number of releases to keep per channel (0 = keep all).'
        required: false
        default: '5'

# One deployment at a time; never cancel a deploy midway.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # A Pages site may not exceed 1 GB; fail early with a clear message.
  MAX_SITE_MB: '950'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KEEP_VERSIONS: ${{ github.event.inputs.keep_versions || '5' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev apt-utils createrepo-c rpm gpg

      - name: Install Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: 'latest'

      - name: Import signing key
        env:
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
        run: |
          echo "$REPO_SIGNING_KEY" | gpg --batch --import
          KEY_FP=$(gpg --list-keys --with-colons packages@sitrep.ch \
            | awk -F: '/^fpr/{print $10; exit}')
          echo "${KEY_FP}:6:" | gpg --import-ownertrust

      - name: Create site directory
        run: mkdir site

      # Release assets never change once published, so cache them per tag.
      # The key changes only when the set of kept releases changes.
      - name: Compute release cache key
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HASH=$(gh release list --repo f-eld-ch/sitrep --exclude-drafts --limit 100 \
            --json tagName,isPrerelease --jq '.[] | "\(.tagName) \(.isPrerelease)"' \
            | { cat; echo "keep=${KEEP_VERSIONS}"; } | sha256sum | cut -c1-16)
          echo "key=releases-${HASH}" >> "$GITHUB_OUTPUT"

      - name: Restore release cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/release-cache
          key: ${{ steps.releases.outputs.key }}
          restore-keys: releases-

      - name: Download packages
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for CH in stable testing; do
            CHANNEL="$CH" bash "$GITHUB_WORKSPACE/scripts/download-packages.sh"
          done

      - name: Place packages into pool
        working-directory: site
        run: |
          for CH in stable testing; do
            CHANNEL="$CH" bash "$GITHUB_WORKSPACE/scripts/place-packages.sh"
          done

      - name: Sign RPM packages
        working-directory: site
        run: |
          for CH in stable testing; do
            CHANNEL="$CH" bash "$GITHUB_WORKSPACE/scripts/sign-rpms.sh"
          done

      - name: Generate APT metadata
        working-directory: site
        run: |
          for CH in stable testing; do
            CHANNEL="$CH" bash "$GITHUB_WORKSPACE/scripts/build-apt.sh"
          done

      - name: Generate RPM metadata
        working-directory: site
        run: |
          for CH in stable testing; do
            CHANNEL="$CH" bash "$GITHUB_WORKSPACE/scripts/build-rpm.sh"
          done

      - name: Generate directory indexes
        working-directory: site
        run: bash "$GITHUB_WORKSPACE/scripts/generate-indexes.sh"

      - name: Build Hugo site
        run: hugo --source "$GITHUB_WORKSPACE" --destination "$RUNNER_TEMP/hugo-out"

      - name: Copy static files
        working-directory: site
        run: |
          cp "$RUNNER_TEMP/hugo-out/index.html" ./
          cp "$GITHUB_WORKSPACE/static-assets/sitrep-signing.asc" ./
          cp "$GITHUB_WORKSPACE/static/sitrep.repo" rpm/
          cp "$GITHUB_WORKSPACE/static/sitrep-testing.repo" rpm/
          cp "$GITHUB_WORKSPACE/static/sitrep.sources" deb/
          cp "$GITHUB_WORKSPACE/static/sitrep-testing.sources" deb/

      - name: Check site size
        run: |
          SIZE_MB=$(du -sm site | cut -f1)
          echo "Site size: ${SIZE_MB} MB (limit ${MAX_SITE_MB} MB)"
          if [ "$SIZE_MB" -gt "$MAX_SITE_MB" ]; then
            echo "::error::Site is ${SIZE_MB} MB, over the GitHub Pages limit. Lower keep_versions."
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
